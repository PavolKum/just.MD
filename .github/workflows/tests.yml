name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Smoke
        run: python tests/smoke.py
      - name: Quick Edit (plus broken builds that must fail)
        run: python tests/test_quick_edit.py
      - name: Disk watch
        run: python tests/test_disk_watch.py
      - name: Performance
        run: python tests/test_perf.py
      - name: Hand-out package
        run: python tests/test_dist.py
